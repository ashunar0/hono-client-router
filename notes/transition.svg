<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14">
  <style>
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .end { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .drop { fill: #fff1f0; stroke: #cf222e; stroke-width: 1.5; }
    .line { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .text { fill: #1f2328; }
    .label { fill: #57606a; font-size: 12px; }
    .arrow { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #8b949e; }
      .end { fill: #0c2d4a; stroke: #4493f8; }
      .drop { fill: #3a1214; stroke: #f85149; }
      .line { stroke: #8b949e; }
      .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
      .arrow { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- 線 -->
  <!-- きっかけ → pushState（クリック・送信） -->
  <path class="line" d="M 280 64 V 85 H 160 V 108" marker-end="url(#arrow)"/>
  <text class="label" x="150" y="100" text-anchor="end">クリック・送信</text>
  <!-- きっかけ → navigate（戻る・進む・最初の表示） -->
  <path class="line" d="M 360 64 V 198" marker-end="url(#arrow)"/>
  <text class="label" x="370" y="135">戻る・進む・最初の表示</text>
  <!-- pushState → navigate -->
  <path class="line" d="M 160 154 V 177 H 250 V 198" marker-end="url(#arrow)"/>
  <!-- navigate → 中断された？ -->
  <path class="line" d="M 320 260 V 288" marker-end="url(#arrow)"/>
  <!-- 中断された？ → 捨てる -->
  <path class="line" d="M 410 330 H 488" marker-end="url(#arrow)"/>
  <text class="label" x="449" y="322" text-anchor="middle">はい</text>
  <!-- 中断された？ → リダイレクト？ -->
  <path class="line" d="M 320 370 V 408" marker-end="url(#arrow)"/>
  <text class="label" x="330" y="394">いいえ</text>
  <!-- リダイレクト？ → replaceState -->
  <path class="line" d="M 230 450 H 182" marker-end="url(#arrow)"/>
  <text class="label" x="206" y="442" text-anchor="middle">はい</text>
  <!-- replaceState → navigate（やり直し） -->
  <path class="line" d="M 110 428 V 230 H 138" marker-end="url(#arrow)"/>
  <text class="label" x="100" y="330" text-anchor="end">やり直す</text>
  <!-- リダイレクト？ → 描画 -->
  <path class="line" d="M 320 490 V 548" marker-end="url(#arrow)"/>
  <text class="label" x="330" y="524">いいえ</text>

  <!-- ノード -->
  <rect class="end" x="220" y="20" width="200" height="44" rx="22"/>
  <text class="text" x="320" y="47" text-anchor="middle">遷移のきっかけ</text>

  <rect class="box" x="60" y="110" width="200" height="44" rx="6"/>
  <text class="text" x="160" y="137" text-anchor="middle">横取りして pushState</text>

  <rect class="box" x="140" y="200" width="360" height="60" rx="6"/>
  <text class="text" x="320" y="224" text-anchor="middle" font-weight="bold">navigate</text>
  <text class="text" x="320" y="246" text-anchor="middle" font-size="13">前の遷移を止めて、Request を作って Hono に渡す</text>

  <polygon class="box" points="320,290 410,330 320,370 230,330"/>
  <text class="text" x="320" y="335" text-anchor="middle">中断された？</text>

  <rect class="drop" x="490" y="308" width="120" height="44" rx="6"/>
  <text class="text" x="550" y="335" text-anchor="middle">結果を捨てる</text>

  <polygon class="box" points="320,410 410,450 320,490 230,450"/>
  <text class="text" x="320" y="455" text-anchor="middle">リダイレクト？</text>

  <rect class="box" x="40" y="428" width="140" height="44" rx="6"/>
  <text class="text" x="110" y="455" text-anchor="middle">replaceState</text>

  <rect class="end" x="140" y="550" width="360" height="50" rx="25"/>
  <text class="text" x="320" y="580" text-anchor="middle">view を描画に知らせて、差分で描画する</text>
</svg>
