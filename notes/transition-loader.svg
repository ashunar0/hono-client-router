<svg xmlns="http://www.w3.org/2000/svg" width="700" height="945" viewBox="0 0 700 945" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14">
  <style>
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .end { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .drop { fill: #fff1f0; stroke: #cf222e; stroke-width: 1.5; }
    .pending { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .line { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .text { fill: #1f2328; }
    .label { fill: #57606a; font-size: 12px; }
    .arrow { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #8b949e; }
      .end { fill: #0c2d4a; stroke: #4493f8; }
      .drop { fill: #3a1214; stroke: #f85149; }
      .pending { fill: #2e2410; stroke: #d29922; }
      .line { stroke: #8b949e; }
      .text { fill: #e6edf3; }
      .label { fill: #8b949e; }
      .arrow { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- 線 -->
  <!-- きっかけ → pushState（クリック・送信） -->
  <path class="line" d="M 300 64 V 85 H 160 V 108" marker-end="url(#arrow)"/>
  <text class="label" x="150" y="100" text-anchor="end">クリック・送信</text>
  <!-- きっかけ → navigate（戻る・進む・最初の表示） -->
  <path class="line" d="M 400 64 V 198" marker-end="url(#arrow)"/>
  <text class="label" x="410" y="135">戻る・進む・最初の表示</text>
  <!-- pushState → navigate -->
  <path class="line" d="M 160 154 V 177 H 260 V 198" marker-end="url(#arrow)"/>
  <!-- navigate → 中断された？ -->
  <path class="line" d="M 350 260 V 288" marker-end="url(#arrow)"/>
  <!-- 中断された？ → 捨てる -->
  <path class="line" d="M 450 330 H 558" marker-end="url(#arrow)"/>
  <text class="label" x="500" y="322" text-anchor="middle">はい</text>
  <!-- 中断された？ → リダイレクト？ -->
  <path class="line" d="M 350 370 V 408" marker-end="url(#arrow)"/>
  <text class="label" x="360" y="394">いいえ</text>
  <!-- リダイレクト？ → replaceState -->
  <path class="line" d="M 250 450 H 182" marker-end="url(#arrow)"/>
  <text class="label" x="216" y="442" text-anchor="middle">はい</text>
  <!-- replaceState → navigate（やり直し） -->
  <path class="line" d="M 110 428 V 230 H 148" marker-end="url(#arrow)"/>
  <text class="label" x="100" y="330" text-anchor="end">やり直す</text>
  <!-- リダイレクト？ → Pending がある？ -->
  <path class="line" d="M 350 490 V 528" marker-end="url(#arrow)"/>
  <text class="label" x="360" y="514">いいえ</text>
  <!-- Pending がある？ → Pending を先に描く -->
  <path class="line" d="M 450 570 H 538" marker-end="url(#arrow)"/>
  <text class="label" x="494" y="562" text-anchor="middle">はい</text>
  <!-- Pending を先に描く → loader -->
  <path class="line" d="M 610 592 V 690 H 502" marker-end="url(#arrow)"/>
  <!-- Pending がある？ → loader -->
  <path class="line" d="M 350 610 V 666" marker-end="url(#arrow)"/>
  <text class="label" x="360" y="642">いいえ</text>
  <!-- loader → 中断された？ -->
  <path class="line" d="M 350 712 V 748" marker-end="url(#arrow)"/>
  <!-- 中断された？ → 捨てる -->
  <path class="line" d="M 450 790 H 558" marker-end="url(#arrow)"/>
  <text class="label" x="500" y="782" text-anchor="middle">はい</text>
  <!-- 中断された？ → 描画 -->
  <path class="line" d="M 350 830 V 868" marker-end="url(#arrow)"/>
  <text class="label" x="360" y="854">いいえ</text>

  <!-- ノード -->
  <rect class="end" x="250" y="20" width="200" height="44" rx="22"/>
  <text class="text" x="350" y="47" text-anchor="middle">遷移のきっかけ</text>

  <rect class="box" x="60" y="110" width="200" height="44" rx="6"/>
  <text class="text" x="160" y="137" text-anchor="middle">横取りして pushState</text>

  <rect class="box" x="150" y="200" width="400" height="60" rx="6"/>
  <text class="text" x="350" y="224" text-anchor="middle" font-weight="bold">navigate</text>
  <text class="text" x="350" y="246" text-anchor="middle" font-size="13">前の遷移を止めて、Hono に当たったルートを聞く</text>

  <polygon class="box" points="350,290 450,330 350,370 250,330"/>
  <text class="text" x="350" y="335" text-anchor="middle">中断された？</text>

  <rect class="drop" x="560" y="308" width="120" height="44" rx="6"/>
  <text class="text" x="620" y="335" text-anchor="middle">結果を捨てる</text>

  <polygon class="box" points="350,410 450,450 350,490 250,450"/>
  <text class="text" x="350" y="455" text-anchor="middle">リダイレクト？</text>

  <rect class="box" x="40" y="428" width="140" height="44" rx="6"/>
  <text class="text" x="110" y="455" text-anchor="middle">replaceState</text>

  <polygon class="box" points="350,530 450,570 350,610 250,570"/>
  <text class="text" x="350" y="575" text-anchor="middle">Pending がある？</text>

  <rect class="pending" x="540" y="548" width="140" height="44" rx="6"/>
  <text class="text" x="610" y="575" text-anchor="middle">Pending を先に描く</text>

  <rect class="box" x="200" y="668" width="300" height="44" rx="6"/>
  <text class="text" x="350" y="695" text-anchor="middle">loader を呼んでデータを待つ</text>

  <polygon class="box" points="350,750 450,790 350,830 250,790"/>
  <text class="text" x="350" y="795" text-anchor="middle">中断された？</text>

  <rect class="drop" x="560" y="768" width="120" height="44" rx="6"/>
  <text class="text" x="620" y="795" text-anchor="middle">結果を捨てる</text>

  <rect class="end" x="150" y="870" width="400" height="50" rx="25"/>
  <text class="text" x="350" y="900" text-anchor="middle">画面のコンポーネントを描いて、スクロールする</text>
</svg>
